<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HVAC AI Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b5cff;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.08);
    }

    .chat {
      height: 360px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .message {
      padding: 12px 15px;
      border-radius: 12px;
      margin: 10px 0;
      max-width: 80%;
    }

    .bot {
      background: #e8f0ff;
      margin-right: auto;
    }

    .user {
      background: #0b5cff;
      color: white;
      margin-left: auto;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      background: #0b5cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .lead-form {
      display: grid;
      gap: 12px;
    }

    .lead-form input {
      width: 100%;
    }

    .success {
      display: none;
      padding: 12px;
      background: #e7f8ed;
      color: #176b35;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #667085;
    }
  </style>
</head>

<body>

<header>
  <h1>HVAC AI Receptionist</h1>
  <p>24/7 virtual front desk for HVAC businesses</p>
</header>

<div class="container">

  <div class="card">
    <h2>AI Receptionist</h2>

    <div id="chat" class="chat">
      <div class="message bot">
        Hi! 👋 Welcome to Comfort Air Services. How can I help you today?
      </div>
    </div>

    <div class="input-row">
      <input
        id="messageInput"
        placeholder="Ask about HVAC service..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="card">
    <h2>Request HVAC Service</h2>

    <div class="lead-form">

      <input
        id="name"
        placeholder="Your name"
      >

      <input
        id="phone"
        placeholder="Phone number"
      >

      <input
        id="service"
        placeholder="What service do you need?"
      >

      <button onclick="submitLead()">
        Request Service
      </button>

      <div id="success" class="success">
        ✅ Thanks! Your service request has been captured.
      </div>

    </div>
  </div>

</div>

<footer>
  Open-source HVAC AI Receptionist • MIT License
</footer>

<script>

let customerName = "";
let customerPhone = "";

function sendMessage() {

  const input = document.getElementById("messageInput");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  setTimeout(() => {

    const lower = text.toLowerCase();

    /*
      Detect phone number
    */
    const phoneMatch = text.match(
      /(?:\+?\d[\d\s\-()]{6,}\d)/
    );

    /*
      Detect name
      Examples:
      My name is John
      I am John
      I'm John
    */
    const nameMatch = text.match(
      /(?:my name is|i am|i'm)\s+([a-zA-Z][a-zA-Z\s]{1,30})/i
    );

    if (nameMatch) {
      customerName = nameMatch[1].trim();
    }

    if (phoneMatch) {
      customerPhone = phoneMatch[0].trim();
    }

    /*
      If customer gave name or phone,
      do NOT ask for the same information again.
    */
    if (nameMatch || phoneMatch) {

      let details = "";

      if (customerName) {
        details += "Thank you, " + customerName + ". ";
      } else {
        details += "Thank you. ";
      }

      if (customerPhone) {
        details += "I have received your phone number. ";
      }

      details +=
        "Your details have been received. Our HVAC team will contact you shortly. ✅";

      addMessage(details, "bot");

      return;
    }

    let reply =
      "I'd be happy to help. Please tell me your name and phone number so our HVAC team can contact you.";

    /*
      Pricing
    */
    if (
      lower.includes("price") ||
      lower.includes("cost") ||
      lower.includes("quote")
    ) {

      reply =
        "HVAC service pricing depends on the problem and service needed. I can collect your details so our team can provide an accurate quote.";

    }

    /*
      Emergency
    */
    else if (
      lower.includes("emergency") ||
      lower.includes("urgent")
    ) {

      reply =
        "For an HVAC emergency, please provide your name and phone number so our service team can contact you.";

    }

    /*
      AC
    */
   else if (
  lower.includes("ac") ||
  lower.includes("air conditioning") ||
  lower.includes("air conditioner")
) {

  if (
    lower.includes("not cooling") ||
    lower.includes("warm air") ||
    lower.includes("hot air")
  ) {
    reply =
      "I'm sorry your AC isn't cooling. Is the AC running but blowing warm air, or is it not turning on at all?";
  }

  else if (
    lower.includes("not turning on") ||
    lower.includes("won't turn on") ||
    lower.includes("not working")
  ) {
    reply =
      "I can help with that. Is the AC completely not turning on, or does it turn on but stop after a few minutes?";
  }

  else if (
    lower.includes("leak") ||
    lower.includes("water leaking") ||
    lower.includes("leaking water")
  ) {
    reply =
      "An AC water leak can have several causes. Please turn off the system if water is reaching electrical areas. Would you like to request a service visit?";
  }

  else if (
    lower.includes("noise") ||
    lower.includes("loud") ||
    lower.includes("strange sound")
  ) {
    reply =
      "Strange AC noises can indicate a mechanical problem. What kind of sound are you hearing?";
  }

  else {
    reply =
      "We can help with AC repair, maintenance, and installation. What problem are you experiencing?";
  }
} 

    /*
      Heating
    */
    else if (
      lower.includes("heat") ||
      lower.includes("furnace") ||
      lower.includes("heating")
    ) {

      reply =
        "We can help with heating and furnace problems. What is happening with your system?";

    }

    /*
      Appointment
    */
    else if (
      lower.includes("appointment") ||
      lower.includes("book") ||
      lower.includes("schedule")
    ) {

      reply =
        "Sure! Please provide your name and phone number, and tell me what HVAC service you need.";

    }

    addMessage(reply, "bot");

  }, 500);
}


function addMessage(text, type) {

  const chat = document.getElementById("chat");

  if (!chat) return;

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


function submitLead() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const service =
    document.getElementById("service").value.trim();

  if (!name || !phone || !service) {

    alert("Please complete all fields.");

    return;
  }

  const leads =
    JSON.parse(
      localStorage.getItem("hvacLeads") || "[]"
    );

  leads.push({

    name: name,

    phone: phone,

    service: service,

    createdAt: new Date().toISOString()

  });

  localStorage.setItem(
    "hvacLeads",
    JSON.stringify(leads)
  );

  document.getElementById("success").style.display =
    "block";

  document.getElementById("name").value = "";

  document.getElementById("phone").value = "";

  document.getElementById("service").value = "";
}

</script>

</body>
  </html>
